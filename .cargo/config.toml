# Runs `cargo test --target wasm32-unknown-unknown` through the wasm-bindgen
# test harness. Requires wasm-bindgen-cli of the same version as the
# wasm-bindgen crate; `cargo xtask dist` verifies and installs it.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"

[alias]
xtask = "run -p xtask --"
