[package]
name = "bangs"
version = "1.0.0"
edition = "2024"
description = "Personal search interface with DuckDuckGo-style bangs, compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match `BINDGEN_VERSION` in the Makefile exactly: the generated JS
# glue is only guaranteed to work against a wasm-bindgen CLI of the same
# version as this crate.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlSpanElement",
    "Location",
    "Node",
    "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
