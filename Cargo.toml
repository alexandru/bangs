[package]
name = "bangs"
version = "1.0.0"
edition = "2024"
description = "Personal search interface with DuckDuckGo-style bangs, compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Must match `BINDGEN_VERSION` in the Makefile exactly: the generated JS
# glue is only guaranteed to work against a wasm-bindgen CLI of the same
# version as this crate.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlSpanElement",
    "Location",
    "Node",
    "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Size-first profile: this ships to browsers, and the logic is cold-path
# (a redirect decision per page load), so `opt-level = "z"` beats speed
# levels. `make dist` runs wasm-opt on top of this.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
